databaseChangeLog:
  - changeSet:
      id: 1
      author: Ilya
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: big serial
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: birth_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(128)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp

        - createIndex:
            tableName: users
            indexName: idx_user_name_surname
            columns:
              - column:
                  name: name
              - column:
                  name: surname

        - createIndex:
            tableName: users
            indexName: idx_user_email
            columns:
              - column:
                  name: email

  - changeSet:
      id: 2
      author: Ilya
      changes:
        - createTable:
            tableName: payment_cards
            columns:
              - column:
                  name: id
                  type: big serial
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: number
                  type: varchar(16)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: holder
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: expiration_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp

        - createIndex:
            tableName: payment_cards
            indexName: idx_payment_card_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: payment_cards
            indexName: idx_payment_card_holder
            columns:
              - column:
                  name: holder

